<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Votan — Панель Деміурга</title>
    <style>
        body { font-family: 'Georgia', serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; justify-content: center; padding: 20px; gap: 20px; }
        .main-col { width: 450px; }
        .side-col { width: 400px; }
        
        .panel { background: #2c2c2c; border: 2px solid #D4AF37; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: sticky; top: 20px; }
        h2, h3 { color: #D4AF37; text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #444; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #111; border: 1px solid #555; color: #fff; border-radius: 5px; box-sizing: border-box; }
        
        button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .btn-full { width: 100%; margin-bottom: 5px; }
        .btn-boss { background: #b71c1c; color: white; }
        .btn-baptize { background: #D4AF37; color: #000; }
        .btn-vote { background: #4a148c; color: white; }
        .btn-5g { background: #1b5e20; color: white; }
        .btn-mock { background: #0277bd; color: white; }
        .btn-stop { background: #444; color: #fff; }

        /* Список гравців без блимання */
        .player-list { height: 750px; overflow-y: auto; background: #111; border: 1px solid #444; border-radius: 5px; padding: 5px; }
        .player-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; transition: background 0.2s; }
        .player-item:hover { background: #252525; }
        .player-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .player-name { font-weight: bold; color: #fff; font-size: 14px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .player-id { font-size: 9px; color: #555; font-family: monospace; }
        
        .player-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .btn-action { font-size: 12px; padding: 5px 8px; min-width: 35px; }
        .btn-action.btn-baptize { background: #D4AF37; color: #000; }
        .btn-action.btn-baptize.done { background: #333; color: #555; cursor: default; }
        .btn-kick { background: #333; color: #f44; border: 1px solid #444; }
        .btn-kick:hover { background: #f44; color: #fff; }
        .btn-target { background: #0277bd; color: #fff; }

        #console { width: 100%; height: 150px; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 5px; overflow-y: auto; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

<div class="main-col">
    <div class="panel">
        <h2>Деміург Контроль</h2>

        <div class="section">
            <label>МОК / КЕРУВАННЯ ЦІЛЛЮ</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="mockID" placeholder="ID (bot1)" value="bot1">
                <input type="text" id="mockName" placeholder="Ім'я" value="Бот">
            </div>
            <input type="text" id="mockAction" placeholder="Дія (!r5, !h1b1, привіт...)">
            <button class="btn-mock btn-full" onclick="sendMock()">🚀 ВИКОНАТИ ВІД ІМЕНІ</button>
        </div>

        <div class="section">
            <label>ІВЕНТИ ТА БОСИ</label>
            <button class="btn-boss btn-full" onclick="sendAdmin('!ящер')">🐉 ВИКЛИКАТИ ЯЩЕРА</button>
            <button class="btn-baptize btn-full" onclick="sendAdmin('!kill_boss')">💀 ВБИТИ ЯЩЕРА (Епічно)</button>
            <button class="btn-5g btn-full" onclick="sendAdmin('!5g')">📡 АТАКА 5G</button>
            <button class="btn-kick btn-full" onclick="sendAdmin('!fix_obs')" style="margin-top: 10px;">🔧 ФІКС КАМЕРИ (Скинути OBS)</button>
        </div>

        <div class="section">
            <label>ГЛОБАЛЬНЕ ВІЧЕ</label>
            <button class="btn-vote btn-full" onclick="sendAdmin('!віче БУДЕМО ЖИТИ?|ТАК|НІ')">⚖️ ЗАПУСТИТИ ВІЧЕ</button>
            <button class="btn-stop btn-full" onclick="sendAdmin('!stop_vote')">🛑 ЗУПИНИТИ ТА ПІДРАХУВАТИ</button>
        </div>

        <div id="console"></div>
    </div>
</div>

<div class="side-col">
    <div class="panel">
        <h3>Слов'яни в ефірі</h3>
        <div class="player-list" id="playerList">
            </div>
    </div>
</div>

<script>
    const ADMIN_SECRET = "GOD_MODE_ADMIN_SECRET"; 
    let ws;

    function log(msg) {
        const c = document.getElementById('console');
        const time = new Date().toLocaleTimeString();
        c.innerHTML = `<div style="margin-bottom:2px;">[${time}] ${msg}</div>` + c.innerHTML;
        if (c.children.length > 50) c.lastChild.remove();
    }

    function connect() {
        ws = new WebSocket('ws://localhost:8080/ws');
        ws.onopen = () => log("Зв'язок з сервером встановлено.");
        ws.onmessage = (e) => {
            try {
                const state = JSON.parse(e.data);
                if (state.players) updatePlayerList(state.players);
            } catch (err) { console.error(err); }
        };
        ws.onclose = () => {
            log("❌ Зв'язок втрачено. Перепідключення...");
            setTimeout(connect, 2000);
        };
    }

    function updatePlayerList(players) {
        const list = document.getElementById('playerList');
        const newIDs = new Set(players.map(p => p.id));

        Array.from(list.children).forEach(child => {
            if (!newIDs.has(child.dataset.id)) child.remove();
        });

        players.forEach(p => {
            let item = list.querySelector(`[data-id="${p.id}"]`);
            const isBaptized = (p.status === 1);
            const nameStr = `${p.name} ${isBaptized ? '👑' : ''}`;

            const content = `
                <div class="player-info">
                    <span class="player-name">${nameStr}</span>
                    <span class="player-id">${p.id}</span>
                </div>
                <div class="player-actions">
                    <button class="btn-action btn-target" title="Обрати ціллю" onclick="setMock('${p.id}', '${p.name}')">🎯</button>
                    <button class="btn-action btn-baptize ${isBaptized ? 'done' : ''}" 
                            onclick="${isBaptized ? '' : `sendAdmin('!baptize ${p.id}')`}">✝️</button>
                    <button class="btn-action btn-kick" onclick="sendAdmin('!kick ${p.id}')">🚫</button>
                </div>
            `;

            if (!item) {
                item = document.createElement('div');
                item.className = "player-item";
                item.dataset.id = p.id;
                item.innerHTML = content;
                list.appendChild(item);
            } else if (item.innerHTML !== content) {
                item.innerHTML = content;
            }
        });
    }

    function setMock(id, name) {
        document.getElementById('mockID').value = id;
        document.getElementById('mockName').value = name;
        log(`Ціль: ${name} обрана для мока.`);
    }

    function sendAdmin(command) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ PlayerID: ADMIN_SECRET, PlayerName: "ADMIN", Action: command }));
        if (!command.startsWith('!kick') && !command.startsWith('!baptize')) log(command);
    }

    function sendMock() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const id = document.getElementById('mockID').value;
        const name = document.getElementById('mockName').value;
        const action = document.getElementById('mockAction').value;
        if (!id || !action) return;
        ws.send(JSON.stringify({ PlayerID: id, PlayerName: name, Action: action }));
    }

    connect();
</script>
</body>
</html>
