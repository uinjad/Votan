<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Votan - Тестер команд</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-bottom: 20px; }
        button { padding: 10px; cursor: pointer; font-weight: bold; }
        input, select { padding: 10px; margin-bottom: 10px; width: 200px; display: block; }
        .log { background: #000; padding: 10px; height: 200px; overflow-y: scroll; font-family: monospace; font-size: 12px; border: 1px solid #444; }
    </style>
</head>
<body>
    <h2>Симулятор чату</h2>
    
    <label>ID гравця:</label>
    <input type="text" id="playerId" value="test_user_1">
    
    <label>Нікнейм:</label>
    <input type="text" id="playerName" value="VotanPlayer">

    <div class="controls">
        <div></div>
        <button onclick="send('!u5')">⬆️</button>
        <div></div>
        
        <button onclick="send('!l5')">⬅️</button>
        <button onclick="send('!d5')">⬇️</button>
        <button onclick="send('!r5')">➡️</button>
    </div>

    <label>Своя команда (напр. !r10):</label>
    <input type="text" id="customCmd" placeholder="!r3">
    <button onclick="sendCustom()">Надіслати</button>

    <div class="log" id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        // Підключаємося до того ж порту, де слухає твій Go-сервер
        const ws = new WebSocket('ws://localhost:8080/ws');

        ws.onopen = () => log("✅ Підключено до сервера");
        ws.onclose = () => log("❌ З'єднання розірвано");

        function log(msg) {
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function send(action) {
            const payload = {
                PlayerID: document.getElementById('playerId').value,
                PlayerName: document.getElementById('playerName').value,
                Action: action
            };
            ws.send(JSON.stringify(payload));
            log(`Надіслано: ${action} для ${payload.PlayerName}`);
        }

        function sendCustom() {
            const val = document.getElementById('customCmd').value;
            if (val) send(val);
        }
    </script>
</body>
</html>
