version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - errorlint     # correct error wrapping/comparison
    - govet
    - staticcheck   # in v2 this also covers gosimple + stylecheck
    - unused
    - ineffassign
    - bodyclose     # HTTP response bodies must be closed

formatters:
  enable:
    - gofmt         # in v2 gofmt is a formatter, not a linter